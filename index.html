<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Analysis Tool</title>
    <!-- Load React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Load Babel to compile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-4">

    <!-- The HTML element where your React app will live -->
    <div id="root"></div>

    <!-- Include your HubAnalysis file and tell Babel to compile it -->
    <script type="text/babel" src="HubAnalysis.jsx"></script>

    <!-- Render the component to the screen -->
    <script type="text/babel">
        // This assumes Claude named the main component 'HubAnalysis'
        // If it throws an error, we might need to check the exact component name at the bottom of HubAnalysis.jsx
        const Root = () => {
            return <HubAnalysis />;
        };
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Root />);
    </script>
</body>
</html>
